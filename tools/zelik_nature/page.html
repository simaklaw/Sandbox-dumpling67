<!doctype html><html><body style="margin:0"><script src="three.min.js"></script><script>
async function loadGLB(url){
  const buf=await (await fetch(url)).arrayBuffer();
  const dv=new DataView(buf);
  const jl=dv.getUint32(12,true);
  const json=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,20,jl)));
  const bin=buf.slice(20+jl+8);
  const acc=(i)=>{const a=json.accessors[i],bv=json.bufferViews[a.bufferView];
    const n={SCALAR:1,VEC2:2,VEC3:3,VEC4:4}[a.type];
    const off=(bv.byteOffset||0)+(a.byteOffset||0);
    const T={5126:Float32Array,5123:Uint16Array,5125:Uint32Array}[a.componentType];
    return {arr:new T(bin,off,a.count*n),n};};
  const mats=json.materials.map(m=>{const c=m.pbrMetallicRoughness.baseColorFactor;
    const col=new THREE.Color();col.setRGB(c[0],c[1],c[2]);
    return new THREE.MeshLambertMaterial({color:col,side:THREE.DoubleSide});});
  const nodes=json.nodes.map(n=>{
    const o=new THREE.Object3D();
    if(n.mesh!=null){
      for(const p of json.meshes[n.mesh].primitives){
        const g=new THREE.BufferGeometry();
        const P=acc(p.attributes.POSITION),N=acc(p.attributes.NORMAL);
        g.setAttribute('position',new THREE.BufferAttribute(P.arr,3));
        g.setAttribute('normal',new THREE.BufferAttribute(N.arr,3));
        g.setIndex(new THREE.BufferAttribute(acc(p.indices).arr,1));
        o.add(new THREE.Mesh(g,mats[p.material||0]));
      }
    }
    if(n.translation)o.position.fromArray(n.translation);
    if(n.rotation)o.quaternion.fromArray(n.rotation);
    if(n.scale)o.scale.fromArray(n.scale);
    return o;});
  json.nodes.forEach((n,i)=>(n.children||[]).forEach(c=>nodes[i].add(nodes[c])));
  const root=new THREE.Group();(json.scenes[0].nodes).forEach(i=>root.add(nodes[i]));
  root.updateMatrixWorld(true);return root;
}
async function renderOne(url,px,yawDeg,pitchDeg){
  const root=await loadGLB(url);
  const canvas=document.createElement('canvas');
  const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true,preserveDrawingBuffer:true});
  if(THREE.sRGBEncoding)renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.setClearColor(0x000000,0);
  const scene=new THREE.Scene();scene.add(root);
  scene.add(new THREE.HemisphereLight(0xffffff,0xb8a898,0.9));
  const d=new THREE.DirectionalLight(0xffffff,0.85);d.position.set(-4,7,5);scene.add(d);
  const f=new THREE.DirectionalLight(0xfff0e0,0.3);f.position.set(5,2,-3);scene.add(f);
  const bb=new THREE.Box3().setFromObject(root);
  const c=new THREE.Vector3();bb.getCenter(c);
  const yaw=yawDeg*Math.PI/180,pitch=pitchDeg*Math.PI/180;
  const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
  const R=30;
  const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
  cam.position.copy(c).addScaledVector(dir,R);cam.up.set(0,1,0);cam.lookAt(c);cam.updateMatrixWorld(true);
  // проекция bbox в экранные оси камеры
  const inv=cam.matrixWorldInverse;
  let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
  for(const x of [bb.min.x,bb.max.x])for(const y of [bb.min.y,bb.max.y])for(const z of [bb.min.z,bb.max.z]){
    const v=new THREE.Vector3(x,y,z).applyMatrix4(inv);mnx=Math.min(mnx,v.x);mxx=Math.max(mxx,v.x);mny=Math.min(mny,v.y);mxy=Math.max(mxy,v.y);}
  const pad=0.03*Math.max(mxx-mnx,mxy-mny);
  mnx-=pad;mxx+=pad;mny-=pad;mxy+=pad;
  const w=mxx-mnx,h=mxy-mny,ppm=px/Math.max(w,h);
  const W=Math.ceil(w*ppm),H=Math.ceil(h*ppm);
  cam.left=mnx;cam.right=mxx;cam.top=mxy;cam.bottom=mny;cam.updateProjectionMatrix();
  canvas.width=W;canvas.height=H;renderer.setSize(W,H,false);
  renderer.render(scene,cam);
  return canvas.toDataURL('image/png');
}
</script></body></html>
