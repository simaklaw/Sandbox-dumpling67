# Автосборка и unit-тесты при каждом push — именно здесь мы увидим ошибки компиляции,
# которые нельзя поймать без Android SDK. Логи сборки пришлите Claude.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Проверка Gradle-файлов в репозитории
        run: |
          missing=0
          for f in settings.gradle.kts build.gradle.kts app/build.gradle.kts gradle/libs.versions.toml; do
            if [ ! -f "$f" ]; then
              echo "::error::Нет файла $f. Экспорт из AI Studio не содержит Gradle-скриптов — добавьте их в репозиторий."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK уже установлен на раннере; принимаем лицензии, остальное докачает Gradle
      - name: Лицензии Android SDK
        run: yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Версия Gradle берётся из gradle-wrapper.properties проекта (9.3.1)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Unit-тесты
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee /tmp/build.log || {
            grep -E "^e: " /tmp/build.log | head -30 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }

      - name: Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Сохранить APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Сохранить отчёты при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/test-results/
